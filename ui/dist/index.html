<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09121f" />
    <title>RSL-Boss-helper</title>
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { background: #07101b; overflow: hidden; }
      #startup-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        color: #e9f5ff;
        background: #07101b;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }
      #startup-shell .startup-mark {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      #startup-shell h1 { margin: 18px 0 6px; font-size: 19px; font-weight: 700; }
      #startup-shell p { margin: 0; color: #8ca5b8; font-size: 12px; }
      #startup-shell .startup-spinner {
        width: 28px;
        height: 28px;
        margin-top: 22px;
        border: 2px solid #183746;
        border-top-color: #59d4c9;
        border-radius: 50%;
        animation: startup-spin .8s linear infinite;
      }
      #startup-shell.startup-failed .startup-spinner { display: none; }
      #startup-shell button {
        display: none;
        margin-top: 22px;
        padding: 9px 18px;
        border: 1px solid #4fbdb5;
        border-radius: 9px;
        color: #07101b;
        background: #59d4c9;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      #startup-shell.startup-failed button { display: block; }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" crossorigin src="/assets/index-C8U17_eh.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CDq-smBk.css">
  </head>
  <body>
    <div id="startup-shell" role="status" aria-live="polite">
      <img class="startup-mark" src="/app-icon.png" alt="" aria-hidden="true" />
      <h1>Initializing RSL-Boss-helper</h1>
      <p>正在初始化 RSL-Boss-helper…</p>
      <span class="startup-spinner" aria-hidden="true"></span>
      <button type="button" onclick="location.reload()">Reload / 重新载入</button>
    </div>
    <div id="root"></div>
    <script>
      window.setTimeout(function () {
        if (document.documentElement.dataset.appMounted === 'true') return
        var shell = document.getElementById('startup-shell')
        if (!shell) return
        shell.classList.add('startup-failed')
        var title = shell.querySelector('h1')
        var detail = shell.querySelector('p')
        if (title) title.textContent = 'The interface did not finish loading'
        if (detail) detail.textContent = '界面未完成载入，可以重新载入页面。'
      }, 15000)
    </script>
  </body>
</html>
